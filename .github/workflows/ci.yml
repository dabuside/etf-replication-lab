name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build single-file site
        run: npm run build

      - name: Headless smoke test
        run: npm run smoke

      - name: Upload built HTML preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: etf-replication-lab-preview
          path: dist/index.html
          retention-days: 14
